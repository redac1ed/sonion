<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>New Tab</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(ellipse 60% 45% at 50% 38%, #141414 0%, #000000 70%);
            color: #ffffff;
            font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
        }
        main {
            width: min(560px, calc(100vw - 48px));
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -6vh;
        }
        main > * {
            animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        main > :nth-child(2) { animation-delay: 0.04s; }
        main > :nth-child(3) { animation-delay: 0.08s; }
        main > :nth-child(4) { animation-delay: 0.12s; }
        .logo {
            width: 52px;
            height: 52px;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 28px;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.8px;
        }
        h1 span {
            color: #525252;
            font-weight: 400;
        }
        form {
            position: relative;
            width: 100%;
        }
        .search-icon {
            position: absolute;
            top: 50%;
            left: 19px;
            width: 18px;
            height: 18px;
            color: #737373;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .search {
            width: 100%;
            height: 52px;
            padding: 0 22px 0 48px;
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 999px;
            outline: none;
            color: #ffffff;
            font: 15px ui-monospace, Consolas, monospace;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .search::placeholder {
            color: #525252;
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        .search:focus {
            border-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
        }
        .tiles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 36px;
        }
        .tile {
            width: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 14px 8px 12px;
            background: transparent;
            border: none;
            border-radius: 14px;
            color: #a3a3a3;
            font: 12px "Segoe UI", system-ui, sans-serif;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, transform 0.15s;
        }
        .tile:hover {
            background: #141414;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .tile-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            background: #141414;
            border: 1px solid #262626;
            border-radius: 50%;
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tile-name {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        footer {
            position: fixed;
            bottom: 22px;
            color: #404040;
            font-size: 12px;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }
        .logo {
            width: 56px;
            height: 56px;
            margin-bottom: 16px;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <main>
        <svg class="logo" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="24" cy="24" r="21"/>
            <circle cx="24" cy="24" r="14" opacity="0.6"/>
            <circle cx="24" cy="24" r="7" opacity="0.35"/>
        </svg>
        <h1>sonion.</h1>
        <form>
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/>
                <path d="M20 20l-3.5-3.5"/>
            </svg>
            <input class="search" spellcheck="false" autocomplete="off" autofocus placeholder="Enter a sonion address, like cool.rizz">
        </form>
    </main>
    <script>
        const open = (value) => {
            const target = (value || "").trim();
            if (target) window.ipc?.postMessage(JSON.stringify({open: target}));
        };
        document.querySelector("form").addEventListener("submit", (e) => {
            e.preventDefault();
            open(document.querySelector(".search").value);
        });
        document.querySelectorAll(".tile").forEach((tile) => {
            tile.addEventListener("click", () => open(tile.dataset.url));
        });
    </script>
</body>
</html>
