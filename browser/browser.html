<!DOCTYPE html> 
<html>
    <head>
        <meta charset="utf-8">
        <style>
            :root {
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
                margin: 0;
            }
            body {
                font: 14px/1.4 system-ui, sans-serif;
                background: #09090b;
                color: #e4e4e7;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            #bar {
                display: flex;
                gap: 6px;
                padding: 8px;
                background: #18181b;
                border-bottom: 1px solid #27272a;
                align-items: center;
            }
            #bar button {
                background: #27272a; 
                color: #e4e4e7; 
                border: 0; 
                border-radius: 6px;
                width: 34px; 
                height: 34px; 
                font-size: 16px; 
                cursor: pointer;
            }
            #bar button:hover { 
                background: #3f3f46; 
            }
            #addr {
                flex: 1; 
                background: #09090b; 
                color: #67e8f9;
                border: 1px solid #27272a; 
                border-radius: 6px;
                padding: 8px 12px; 
                font: 13px/1 ui-monospace, monospace; 
                outline: none;
            }
            #addr:focus { 
                border-color: #0891b2; 
            }
        </style>
    </head>
    <body> 
        <div id="bar">
            <button id="back" title="back">&#8952;</button>
            <button id="fwd" title="forward">&#8594;</button>
            <button id="reload" title="reload">&#8635;</button>
            <input id="addr" spellcheck="false" placeholder="sonion://mysite/" />     
            <button id="go" title="go">&#10148;</button>
        </div>
        <div id="status">ready</div>
        <iframe id="view" src="about:blank"></iframe>
    </body>
    <script>
        const addr = document.getElementById("addr");
        const view = document.getElementById("view");
        const status = document.getElementById("status");
        const history = [];
        let pos = -1;
        
        function normalize(input) {
            input = input.trim();
            if (!input) return null;
            if (input.startsWith("sonion://")) return input;
            if (/^https?:\/\//.test(input)) return input;
            return "sonion://" + input;
        }
        function send(msg) {
            window.ipc.postMessage(JSON.stringify(msg));
        }
        async function nav(url, push) {
            const target = normalize(url);
            if (!target) return;
            if (target.startsWith("http://") || target.startsWith("https://")) {
                send({cmd: "external", url: target});
                status.textContent = "opened in default browser: " + target;
                return;
            }
            if (push) {
                history.length = pos + 1;
                history.push(target);
                pos = history.length - 1;
            }
            addr.value = target; 
            status.textContent = "loading " + target + " ...";
            send({cmd: "nav", url: target});
        }
        
        document.getElementById("go").onclick = () => nav(addr.value, true);
        addr.addEventListener("keydown", (e) => {if (e.key === "Enter") nav(addr.value, true);});
        document.getElementById("back").onclick = () => {if (pos > 0) {pos--; nav(history[pos], false);}};
        document.getElementById("fwd").onclick = () => {if (pos < history.length - 1) {pos++; nav(history[pos], false);}};
        document.getElementById("reload").onclick = () => {if (pos >= 0) nav(history[pos], false);};

        send({cmd: "nav", url: "sonion://cool.rizz"});
        addr.value = "sonion://cool.rizz";
        history.push("sonion://cool.rizz"); pos = 0;
    </script>
</html>
