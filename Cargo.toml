[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/sonion", "crates/registry"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
rustls = "0.23"
tokio-rustls = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rcgen = "0.13"      
tracing = "0.1"
webpki-roots = "0.26"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
sonion-protocol = {path = "crates/protocol"}
sonion-server = {path = "crates/server"}
mime_guess = "2"
anyhow = "1"
tempfile = "3"