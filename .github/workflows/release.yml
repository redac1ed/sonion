name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p sonion --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=sonion-${{ matrix.target }}
          tar -czf $name.tar.gz -C target/${{ matrix.target }}/release sonion
          shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "sonion-${{ matrix.target }}"
          Compress-Archive -Path target/${{ matrix.target }}/release/sonion.exe -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: sonion-${{ matrix.target }}
          path: sonion-${{ matrix.target }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
